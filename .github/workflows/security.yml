name: Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Semgrep SAST
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            semgrep/semgrep:1.174.0 \
            semgrep scan --config auto --error /src

      - name: Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.0 \
            dir /repo --no-banner

      - name: Trivy filesystem scan
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            aquasec/trivy:0.69.3 \
            fs --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            /repo

      - name: Build Docker image
        run: |
          docker build \
            -t devsecops-demo:${{ github.sha }} \
            -f app/Dockerfile app

      - name: Trivy image scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.69.3 \
            image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            devsecops-demo:${{ github.sha }}

      - name: Checkov
        run: |
          docker run --rm \
            -v "$PWD:/tf" \
            bridgecrew/checkov:3.3.9 \
            -d /tf/terraform \
            --framework terraform
