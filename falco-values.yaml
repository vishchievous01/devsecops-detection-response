driver:
  kind: modern_ebpf

tty: true

falco:
  rule_matching: all

customRules:
  devsecops-rules.yaml: |-
    - rule: DevSecOps Interactive Shell in Demo Container
      desc: Detect interactive shell execution inside the DevSecOps demo container
      condition: >
        spawned_process
        and container
        and shell_procs
        and proc.tty != 0
        and container.name = "devsecops-demo"
      output: >
        DevSecOps demo container interactive shell detected
        (user=%user.name uid=%user.uid process=%proc.name
        command=%proc.cmdline container=%container.name
        pod=%k8s.pod.name namespace=%k8s.ns.name)
      priority: WARNING
      tags: [container, shell, mitre_execution, T1059]
